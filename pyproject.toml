[project]
name = "product-intelligence-v1"
version = "0.1.0"
description = "Evidence-backed digital product intelligence backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
